models:
  - name: dim_date
    description: "Calendar, one row per day, Dec 2020 to Dec 2021."
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_reports
    description: "One row per VAERS report (Jan–Nov 2021 COVID-19 vaccines). Central fact table."
    columns:
      - name: vaers_id
        data_tests: [unique, not_null]
      - name: received_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: state_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_code
      - name: age_group
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_age_group')
                field: age_group
      - name: manufacturer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_manufacturer')
                field: manufacturer
      - name: is_serious
        description: "TRUE if death, life-threatening, hospitalized, prolonged stay, disability, or birth defect."

  - name: fct_report_symptoms
    description: "Bridge: one row per report x symptom (MedDRA term)."
    columns:
      - name: report_symptom_id
        data_tests: [unique, not_null]
      - name: vaers_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_reports')
                field: vaers_id

  - name: fct_report_vaccines
    description: "Bridge: one row per report x vaccine dose."
    columns:
      - name: report_vaccine_id
        data_tests: [unique, not_null]
      - name: vaers_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_reports')
                field: vaers_id
      - name: manufacturer
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_manufacturer')
                field: manufacturer